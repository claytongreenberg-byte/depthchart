<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>District 6-6A Live Roster & Lineup</title>
  <style>
    :root {
      --primary-color: #003366;
      --accent-color: #d9534f;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-muted: #6c757d;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    h1 {
      margin: 0 0 5px 0;
      color: var(--primary-color);
    }

    .subtitle {
      font-weight: 600;
      color: var(--text-muted);
      margin: 0 0 15px 0;
    }

    .district-badge {
      display: inline-block;
      background: var(--primary-color);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .roster-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .player-card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      align-items: center;
      border-left: 4px solid var(--primary-color);
    }

    .player-number {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--primary-color);
      min-width: 45px;
      text-align: center;
      margin-right: 15px;
    }

    .player-details {
      flex-grow: 1;
    }

    .player-name {
      font-weight: 700;
      font-size: 1.1rem;
      line-height: 1.2;
      color: #111;
    }

    .player-pronunciation {
      font-size: 0.85rem;
      font-style: italic;
      color: var(--accent-color);
      margin-top: 2px;
      min-height: 1.1em; /* Preserves layout height even if empty */
    }

    .player-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Game Day Lineup</h1>
    <p class="subtitle">UIL District 6-6A</p>
    <div class="district-badge">
      Coppell • RISD (Berkner, LH, Pearce, Richardson) • PISD (Plano, East, West)
    </div>
  </header>

  <div id="roster-container" class="roster-grid">
    <div class="loading">Loading lineup data...</div>
  </div>
</div>

<script>
  // Replace with your published Google Sheet JSON endpoint or Apps Script Web App URL
  const GOOGLE_SHEET_JSON_URL = 'YOUR_GOOGLE_SCHED_OR_APPS_SCRIPT_URL_HERE';

  async function loadRoster() {
    try {
      const response = await fetch(GOOGLE_SHEET_JSON_URL);
      const data = await response.json();
      renderRoster(data);
    } catch (error) {
      console.error('Error fetching roster data:', error);
      // Fallback sample rendering for display/testing
      renderRoster([
        { number: "10", name: "Chris Martinez", pronunciation: "MAR-tee-nez", position: "QB", class: "Sr." },
        { number: "52", name: "Alexander Szymanski", pronunciation: "shih-MAN-skee", position: "LB", class: "Jr." },
        { number: "88", name: "Jordan Smith", pronunciation: "", position: "WR", class: "Sr." }
      ]);
    }
  }

  function renderRoster(players) {
    const container = document.getElementById('roster-container');
    container.innerHTML = '';

    players.forEach(player => {
      const card = document.createElement('div');
      card.className = 'player-card';

      const pronunciationHtml = player.pronunciation 
        ? `<div class="player-pronunciation">"${escapeHtml(player.pronunciation)}"</div>`
        : `<div class="player-pronunciation"></div>`;

      card.innerHTML = `
        <div class="player-number">#${escapeHtml(String(player.number))}</div>
        <div class="player-details">
          <div class="player-name">${escapeHtml(player.name)}</div>
          ${pronunciationHtml}
          <div class="player-meta">${escapeHtml(player.position)} • ${escapeHtml(player.class)}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function escapeHtml(str) {
    return String(str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // Initial call
  loadRoster();
</script>

</body>
</html>
